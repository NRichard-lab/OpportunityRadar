name: opportunity-radar

services:
  opportunity-radar-backend:
    image: "${OPPORTUNITY_RADAR_IMAGE_PREFIX:-blueash}/opportunity-radar-backend:${OPPORTUNITY_RADAR_BACKEND_RELEASE_SHA:?Set OPPORTUNITY_RADAR_BACKEND_RELEASE_SHA to the full backend release commit SHA}"
    user: "10001:10001"
    init: true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 60s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - "seccomp:${OPPORTUNITY_RADAR_SECCOMP_PROFILE:-./docker/backend/seccomp_profile.json}"
    pids_limit: 256
    cpus: "1.00"
    # The no-browser baseline is ~640 MiB; one headless Chromium tree adds
    # ~300-500 MiB, so 768 MiB caused the OOM killer to take Chromium mid-run
    # (oom_score_adj 300). 1536 MiB covers "baseline + one Chromium" with margin.
    # Still one backend replica, one Uvicorn worker (image CMD --workers 1), one
    # browser (APP_MAX_BROWSER_WORKERS=1); no security restriction changes.
    mem_limit: 1536m
    env_file:
      - path: "${OPPORTUNITY_RADAR_ENV_FILE:-./deploy/opportunity-radar.env.example}"
        required: true
    environment:
      APP_ENV: production
      AUTH_MODE: portal_handoff
      APP_BASE_PATH: ""
      APP_PUBLIC_URL: https://radar.blueashdigital.tech
      BLUEASH_PORTAL_PUBLIC_URL: https://blueashdigital.tech
      BLUEASH_PORTAL_API_URL: https://api.blueashdigital.tech
      BLUEASH_AUTH_CLIENT_ID: opportunity-radar
      RADAR_SESSION_COOKIE_NAME: __Host-opportunity_radar_session
      RADAR_SESSION_IDLE_SECONDS: "1800"
      RADAR_SESSION_ABSOLUTE_MAX_SECONDS: "28800"
      RADAR_INTROSPECTION_CACHE_SECONDS: "0"
      RADAR_HANDOFF_STATE_TTL_SECONDS: "300"
      DATABASE_URL: sqlite:////var/lib/opportunity-radar/database/opportunity_radar.db
      APP_DATA_DIR: /var/lib/opportunity-radar/data
      APP_IMPORT_DIR: /var/lib/opportunity-radar/data/imports
      APP_OUTPUT_DIR: /var/lib/opportunity-radar/exports
      APP_EXPORT_DIR: /var/lib/opportunity-radar/exports
      APP_BACKUP_DIR: /var/lib/opportunity-radar/backups
      APP_LOG_DIR: /var/log/opportunity-radar
      APP_WRITE_FRONTEND_MIRRORS: "false"
      REQUIRE_EXISTING_DATABASE: "true"
      DEPLOYMENT_VERSION: "${OPPORTUNITY_RADAR_BACKEND_RELEASE_SHA}"
    expose:
      - "8000"
    volumes:
      - type: bind
        source: "${OPPORTUNITY_RADAR_HOST_ROOT:-/srv/opportunity-radar}/database"
        target: /var/lib/opportunity-radar/database
      - type: bind
        source: "${OPPORTUNITY_RADAR_HOST_ROOT:-/srv/opportunity-radar}/data"
        target: /var/lib/opportunity-radar/data
      - type: bind
        source: "${OPPORTUNITY_RADAR_HOST_ROOT:-/srv/opportunity-radar}/exports"
        target: /var/lib/opportunity-radar/exports
      - type: bind
        source: "${OPPORTUNITY_RADAR_HOST_ROOT:-/srv/opportunity-radar}/backups"
        target: /var/lib/opportunity-radar/backups
      - type: bind
        source: "${OPPORTUNITY_RADAR_HOST_ROOT:-/srv/opportunity-radar}/logs"
        target: /var/log/opportunity-radar
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1770,uid=10001,gid=10001
      - /var/lib/opportunity-radar/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1770,uid=10001,gid=10001
      - /dev/shm:rw,nosuid,nodev,size=256m,mode=1770,uid=10001,gid=10001
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    networks:
      - blueash-edge

  opportunity-radar-frontend:
    image: "${OPPORTUNITY_RADAR_IMAGE_PREFIX:-blueash}/opportunity-radar-frontend:${OPPORTUNITY_RADAR_RELEASE_SHA:?Set OPPORTUNITY_RADAR_RELEASE_SHA to the full release commit SHA}"
    user: "10001:10001"
    init: true
    restart: unless-stopped
    stop_signal: SIGQUIT
    stop_grace_period: 60s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    cpus: "0.25"
    mem_limit: 128m
    expose:
      - "8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1770,uid=10001,gid=10001
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    networks:
      - blueash-edge

networks:
  blueash-edge:
    external: true
    name: "${BLUEASH_EDGE_NETWORK:-blueash-edge}"
