map $uri $opportunity_radar_cache_control {
    default       "no-cache";
    ~^/assets/    "public, max-age=31536000, immutable";
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header Cache-Control $opportunity_radar_cache_control;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Caddy owns API routing. A routing error must never turn an API response
    # into the SPA shell, and application snapshots must never be web-served.
    location = /api {
        return 404;
    }

    location ^~ /api/ {
        return 404;
    }

    location = /data {
        return 404;
    }

    location ^~ /data/ {
        return 404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
